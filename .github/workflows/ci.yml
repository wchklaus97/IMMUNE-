name: IMMUNE CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate-and-export:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout with Git LFS
        uses: actions/checkout@v7
        with:
          lfs: true

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install local QA dependencies
        run: npm ci --ignore-scripts

      - name: Test local release tools and playtest template
        run: |
          npm run test:tools
          npm run validate:playtest-template

      - name: Test research-network web UI
        working-directory: ui/immune-research-network
        run: npm test

      - name: Build research-network web UI
        working-directory: ui/immune-research-network
        run: npm run build

      - name: Verify translation tables and complete research catalog localization
        run: |
          node tools/validate_translation_csv.mjs
          node tools/generate_catalog_localization.mjs --check
          npm run validate:release-audio
          npm run validate:steam-assets

      - name: Validate release identity contract
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            node tools/validate_release_contract.mjs --tag="$GITHUB_REF_NAME"
          else
            node tools/validate_release_contract.mjs
          fi
          npm run validate:v8-5-export
          npm run validate:v8-6-export

      - name: Set up Godot 4.7.2 and export templates
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: true

      - name: Warm fresh Godot import cache
        run: |
          set -o pipefail
          godot --headless --path godot/immune --import 2>&1 | tee godot-import-warmup.log
          known_translation_bootstrap="res://translations/(game|research_catalog)\.(zh_HK|en)\.translation"
          if grep -E "SCRIPT ERROR|Parse Error|Compile Error|ERROR:" godot-import-warmup.log \
            | grep -Ev "^ERROR: Cannot open file '$known_translation_bootstrap'\.$|^ERROR: Failed loading resource: $known_translation_bootstrap\.$" \
            > godot-import-warmup-unexpected.log; then
            cat godot-import-warmup-unexpected.log
            exit 1
          fi
          for translation in \
            game.en.translation game.zh_HK.translation \
            research_catalog.en.translation research_catalog.zh_HK.translation; do
            test -s "godot/immune/translations/$translation"
          done

      - name: Validate imported project and scripts
        run: |
          set -o pipefail
          godot --headless --path godot/immune --import 2>&1 | tee godot-import.log
          if grep -E "SCRIPT ERROR|Parse Error|Compile Error|ERROR:" godot-import.log; then exit 1; fi

      - name: Run Godot release smoke
        run: |
          set -o pipefail
          smoke_dir="$(mktemp -d)"
          godot --headless --path godot/immune --script res://tools/smoke.gd -- --save-path="$smoke_dir/state.json" 2>&1 | tee godot-smoke.log
          grep -F "SMOKE_OK missions=6 families=6 save=v2 audio=ready gamepad=ready active_skills=6 encounters=6 touch=ready signatures=T+B traits=enrage+regen authored_jelly=T+B+M+N+A+D gel_fizzy=T+B+M+N+A+D gel_look=v8_6" godot-smoke.log
          if grep -E "SCRIPT ERROR|Parse Error|Compile Error|ERROR:" godot-smoke.log; then exit 1; fi

      - name: Run preserved gel selector smoke matrix
        run: |
          set -o pipefail
          for gel_look in v5 v6 v7 v8 v8_1 v8_2 v8_3 v8_4 v8_5 v8_6; do
            smoke_dir="$(mktemp -d)"
            IMMUNE_GEL_LOOK="$gel_look" godot --headless --path godot/immune \
              --script res://tools/smoke.gd -- --save-path="$smoke_dir/state.json" \
              2>&1 | tee "godot-smoke-$gel_look.log"
            grep -F "SMOKE_OK missions=6 families=6 save=v2 audio=ready gamepad=ready active_skills=6 encounters=6 touch=ready signatures=T+B traits=enrage+regen authored_jelly=T+B+M+N+A+D gel_fizzy=T+B+M+N+A+D gel_look=$gel_look" \
              "godot-smoke-$gel_look.log"
            if grep -E "SCRIPT ERROR|Parse Error|Compile Error|ERROR:" \
              "godot-smoke-$gel_look.log"; then exit 1; fi
          done

      - name: Validate exact V8.6 animation contract
        run: npm run validate:v8-6-animations -- --godot="$(command -v godot)"

      - name: Build and probe isolated V8.5 candidate PCK
        run: |
          candidate_dir="$(mktemp -d)"
          candidate_pck="$candidate_dir/v8-5-candidate.pck"
          node tools/godot_checked_command.mjs \
            --log="$candidate_dir/export.log" \
            --expect=V8_5_RAW_EXPORT_ADDED \
            -- godot --headless --path godot/immune \
            --export-pack "Web V8.5 Candidate" "$candidate_pck"
          npm run validate:v8-5-export -- --pck="$candidate_pck"
          node tools/godot_checked_command.mjs \
            --log="$candidate_dir/probe.log" \
            --expect=V8_5_CANDIDATE_PROBE_OK \
            -- godot --headless --main-pack "$candidate_pck" \
            --script "$PWD/tools/godot/v8_5_candidate_probe.gd"

      - name: Build and probe promoted V8.6 shipping and candidate PCKs
        run: |
          probe_dir="$(mktemp -d)"
          shipping_pck="$probe_dir/v8-6-shipping.pck"
          candidate_pck="$probe_dir/v8-6-candidate.pck"
          node tools/godot_checked_command.mjs \
            --log="$probe_dir/shipping-export.log" \
            --expect=V8_6_RAW_EXPORT_ADDED \
            -- godot --headless --path godot/immune \
            --export-pack "Web" "$shipping_pck"
          npm run validate:v8-6-export -- --pck="$shipping_pck"
          node tools/godot_checked_command.mjs \
            --log="$probe_dir/shipping-probe.log" \
            --expect=V8_6_EXPORT_PROBE_OK \
            -- godot --headless --main-pack "$shipping_pck" \
            --script "$PWD/tools/godot/v8_6_candidate_probe.gd"
          IMMUNE_GEL_LOOK=v8_3 node tools/godot_checked_command.mjs \
            --log="$probe_dir/rollback-probe.log" \
            --expect=V8_3_ROLLBACK_PROBE_OK \
            -- godot --headless --main-pack "$shipping_pck" \
            --script "$PWD/tools/godot/v8_3_rollback_probe.gd"
          node tools/godot_checked_command.mjs \
            --log="$probe_dir/candidate-export.log" \
            --expect=V8_6_RAW_EXPORT_ADDED \
            -- godot --headless --path godot/immune \
            --export-pack "Web V8.6 Candidate" "$candidate_pck"
          npm run validate:v8-6-export -- --pck="$candidate_pck"
          node tools/godot_checked_command.mjs \
            --log="$probe_dir/candidate-probe.log" \
            --expect=V8_6_EXPORT_PROBE_OK \
            -- godot --headless --main-pack "$candidate_pck" \
            --script "$PWD/tools/godot/v8_6_candidate_probe.gd"

      - name: Validate screenshot and preview provenance contracts
        run: |
          set -o pipefail
          contract_dir="$(mktemp -d)"
          godot --headless --path godot/immune --script res://tools/shot_contract.gd -- \
            --save-path="$contract_dir/state.json" 2>&1 | tee godot-shot-contract.log
          grep -F "SHOT_CONTRACT_OK scalar=3,-0.5,1 sequence=forward+reverse preview=fail-closed" \
            godot-shot-contract.log
          if grep -E "SCRIPT ERROR|Parse Error|Compile Error|ERROR:" \
            godot-shot-contract.log; then exit 1; fi
          set +e
          godot --headless --path godot/immune res://tools/shot.tscn -- \
            --scene=res://tools/anim_preview.tscn --out="$contract_dir/rejected-shot" \
            --tag=rejected --family=B --body=legacy-glb \
            --save-path="$contract_dir/rejected-shot-state.json" \
            >godot-shot-rejected.log 2>&1
          rejected_shot_status=$?
          godot --headless --path godot/immune res://tools/anim_preview.tscn -- \
            --family=B --body=legacy-glb \
            --save-path="$contract_dir/rejected-direct-state.json" \
            >godot-anim-preview-rejected.log 2>&1
          rejected_direct_status=$?
          set -e
          if [[ "$rejected_shot_status" -ne 2 || "$rejected_direct_status" -ne 2 ]]; then
            cat godot-shot-rejected.log godot-anim-preview-rejected.log
            exit 1
          fi
          grep -F "no approved legacy GLB exists for family B" godot-shot-rejected.log
          grep -F "no approved legacy GLB exists for family B" godot-anim-preview-rejected.log
          if grep -E "SCRIPT ERROR|Parse Error|Compile Error" \
            godot-shot-rejected.log godot-anim-preview-rejected.log; then exit 1; fi

      - name: Run bounded campaign balance regression
        run: |
          set -o pipefail
          timeout 7m godot --headless --path godot/immune --script res://tools/balance_matrix.gd -- --out=user://ci-balance.json --missions=MISSION-01,MISSION-06 --families=T,B --trials=1 2>&1 | tee godot-balance.log
          grep -F "BALANCE_MATRIX_OK runs=4" godot-balance.log
          if grep -E "SCRIPT ERROR|Parse Error|Compile Error|ERROR:" godot-balance.log; then exit 1; fi

      - name: Run six-family gameplay regression
        run: |
          set -o pipefail
          timeout 8m godot --headless --path godot/immune --script res://tools/balance_matrix.gd -- --out=user://ci-six-family.json --missions=MISSION-01 --families=T,B,M,N,A,D --trials=1 2>&1 | tee godot-six-family.log
          grep -F "BALANCE_MATRIX_OK runs=6" godot-six-family.log
          if grep -E "SCRIPT ERROR|Parse Error|Compile Error|ERROR:" godot-six-family.log; then exit 1; fi

      - name: Check research HUD layout
        run: |
          set -o pipefail
          godot --headless --path godot/immune --script res://tools/check_overflow.gd 2>&1 | tee godot-layout.log
          grep -F "OVERFLOW_CHECK_OK" godot-layout.log
          if grep -E "SCRIPT ERROR|Parse Error|Compile Error|ERROR:" godot-layout.log; then exit 1; fi

      - name: Export Windows, Linux, macOS, and Web demos
        run: |
          mkdir -p godot/immune/build/releases/web
          node tools/godot_checked_command.mjs --log=godot-export-windows.log --expect=V8_6_RAW_EXPORT_ADDED -- \
            godot --headless --path godot/immune --export-release \
            "Windows Desktop" build/releases/IMMUNE-windows.exe
          node tools/godot_checked_command.mjs --log=godot-export-linux.log --expect=V8_6_RAW_EXPORT_ADDED -- \
            godot --headless --path godot/immune --export-release \
            "Linux/X11" build/releases/IMMUNE-linux.x86_64
          node tools/godot_checked_command.mjs --log=godot-export-macos.log --expect=V8_6_RAW_EXPORT_ADDED -- \
            godot --headless --path godot/immune --export-release \
            "macOS" build/releases/IMMUNE-macOS.zip
          node tools/godot_checked_command.mjs --log=godot-export-web.log --expect=V8_6_RAW_EXPORT_ADDED -- \
            godot --headless --path godot/immune --export-release \
            "Web" build/releases/web/index.html
          node tools/validate_release_contract.mjs --artifacts=godot/immune/build/releases
          node tools/validate_steam_readiness.mjs --artifacts=godot/immune/build/releases

      - name: Export isolated Windows, Linux, macOS, and Web V8.6 candidates
        run: |
          mkdir -p godot/immune/build/v8-6-candidate/web
          node tools/godot_checked_command.mjs \
            --log=godot-v8-6-export-windows.log \
            --expect=V8_6_RAW_EXPORT_ADDED -- \
            godot --headless --path godot/immune --export-release \
            "Windows Desktop V8.6 Candidate" build/v8-6-candidate/IMMUNE-windows.exe
          node tools/godot_checked_command.mjs \
            --log=godot-v8-6-export-linux.log \
            --expect=V8_6_RAW_EXPORT_ADDED -- \
            godot --headless --path godot/immune --export-release \
            "Linux/X11 V8.6 Candidate" build/v8-6-candidate/IMMUNE-linux.x86_64
          node tools/godot_checked_command.mjs \
            --log=godot-v8-6-export-macos.log \
            --expect=V8_6_RAW_EXPORT_ADDED -- \
            godot --headless --path godot/immune --export-release \
            "macOS V8.6 Candidate" build/v8-6-candidate/IMMUNE-macOS.zip
          node tools/godot_checked_command.mjs \
            --log=godot-v8-6-export-web.log \
            --expect=V8_6_RAW_EXPORT_ADDED -- \
            godot --headless --path godot/immune --export-release \
            "Web V8.6 Candidate" build/v8-6-candidate/web/index.html
          npm run validate:v8-6-export -- \
            --pck=godot/immune/build/v8-6-candidate/IMMUNE-linux.pck

      - name: Exercise exported Web demo under baseline and constrained profiles
        timeout-minutes: 5
        run: npm run test:web-release -- --artifacts=godot/immune/build/releases/web --out=outputs/ci-web-release-qa --duration-ms=4000 --gate-mode=compatibility-only

      - name: Exercise exported V8.6 Web candidate
        timeout-minutes: 5
        run: npm run test:web-release -- --artifacts=godot/immune/build/v8-6-candidate/web --out=outputs/ci-v8-6-web-qa --duration-ms=4000 --gate-mode=compatibility-only

      - name: Upload Web release QA evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: immune-web-release-qa-${{ github.sha }}
          path: outputs/ci-web-release-qa
          if-no-files-found: warn
          retention-days: 14

      - name: Upload V8.6 Web QA evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: immune-v8-6-web-qa-${{ github.sha }}
          path: outputs/ci-v8-6-web-qa
          if-no-files-found: warn
          retention-days: 14

      - name: Upload release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: immune-demo-${{ github.sha }}
          path: godot/immune/build/releases
          if-no-files-found: error

      - name: Upload isolated V8.6 candidate artifacts
        uses: actions/upload-artifact@v7
        with:
          name: immune-v8-6-candidate-${{ github.sha }}
          path: godot/immune/build/v8-6-candidate
          if-no-files-found: error

  native-release-smoke:
    needs: validate-and-export
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10

    steps:
      - name: Checkout evidence tooling
        uses: actions/checkout@v7

      - name: Set up Node.js for evidence sealing
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Download release artifacts
        uses: actions/download-artifact@v8
        with:
          name: immune-demo-${{ github.sha }}
          path: release

      - name: Launch Linux release
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -o pipefail
          cd release
          chmod +x IMMUNE-linux.x86_64
          timeout 30s ./IMMUNE-linux.x86_64 --headless --audio-driver Dummy --log-file linux-release-smoke.log -- --release-smoke
          cat linux-release-smoke.log
          grep -F "RELEASE_SMOKE_OK platform=Linux nodes=200" linux-release-smoke.log
          if grep -E "SCRIPT ERROR|Parse Error|Compile Error|ERROR:" linux-release-smoke.log; then exit 1; fi
          node ../tools/create_native_smoke_evidence.mjs \
            --platform=Linux \
            --log=linux-release-smoke.log \
            --artifact=IMMUNE-linux.x86_64 \
            --pck=IMMUNE-linux.pck \
            --out=../native-smoke-evidence/linux.json \
            --commit="$GITHUB_SHA" \
            --version=0.5.0-rc.1

      - name: Launch Windows release
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $logPath = Join-Path $PWD "windows-release-smoke.log"
          $arguments = @(
            "--headless",
            "--audio-driver", "Dummy",
            "--log-file", $logPath,
            "--", "--release-smoke"
          )
          $process = Start-Process -FilePath ".\release\IMMUNE-windows.exe" -ArgumentList $arguments -PassThru
          if (-not $process.WaitForExit(30000)) {
            $process.Kill($true)
            throw "Windows release smoke timed out after 30 seconds"
          }
          if ($process.ExitCode -ne 0) {
            throw "Windows release exited with code $($process.ExitCode)"
          }
          $log = Get-Content $logPath -Raw
          Write-Output $log
          if ($log -notmatch "RELEASE_SMOKE_OK platform=Windows nodes=200") {
            throw "Windows release smoke marker missing"
          }
          if ($log -match "SCRIPT ERROR|Parse Error|Compile Error|ERROR:") {
            throw "Windows release log contains an engine error"
          }
          $versionInfo = (Get-Item ".\release\IMMUNE-windows.exe").VersionInfo
          if ($versionInfo.ProductName -ne "IMMUNE") {
            throw "Windows ProductName mismatch: $($versionInfo.ProductName)"
          }
          if ($versionInfo.CompanyName -ne "wchklaus97") {
            throw "Windows CompanyName mismatch: $($versionInfo.CompanyName)"
          }
          if ($versionInfo.FileDescription -ne "IMMUNE playable demo") {
            throw "Windows FileDescription mismatch: $($versionInfo.FileDescription)"
          }
          if (-not $versionInfo.FileVersion.StartsWith("0.5.0.1")) {
            throw "Windows FileVersion mismatch: $($versionInfo.FileVersion)"
          }
          if (-not $versionInfo.ProductVersion.StartsWith("0.5.0-rc.1")) {
            throw "Windows ProductVersion mismatch: $($versionInfo.ProductVersion)"
          }
          node tools/create_native_smoke_evidence.mjs `
            --platform=Windows `
            --log="$logPath" `
            --artifact=release/IMMUNE-windows.exe `
            --pck=release/IMMUNE-windows.pck `
            --out=native-smoke-evidence/windows.json `
            --commit="$env:GITHUB_SHA" `
            --version=0.5.0-rc.1

      - name: Launch macOS release
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -o pipefail
          cd release
          unzip -q IMMUNE-macOS.zip -d macos
          chmod +x macos/IMMUNE.app/Contents/MacOS/IMMUNE
          codesign --verify --deep --strict macos/IMMUNE.app
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' macos/IMMUNE.app/Contents/Info.plist)" = "com.wchklaus97.immune"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' macos/IMMUNE.app/Contents/Info.plist)" = "0.5.0"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' macos/IMMUNE.app/Contents/Info.plist)" = "1"
          icon_file="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIconFile' macos/IMMUNE.app/Contents/Info.plist)"
          test -n "$icon_file"
          test -f "macos/IMMUNE.app/Contents/Resources/$icon_file"
          architectures="$(lipo -archs macos/IMMUNE.app/Contents/MacOS/IMMUNE)"
          [[ "$architectures" == *arm64* && "$architectures" == *x86_64* ]]
          codesign -d --entitlements :- macos/IMMUNE.app > macos/entitlements.plist 2> macos/codesign-entitlements.log
          test "$(/usr/libexec/PlistBuddy -c 'Print :com.apple.security.cs.disable-library-validation' macos/entitlements.plist)" = "true"
          test "$(/usr/libexec/PlistBuddy -c 'Print :com.apple.security.cs.allow-dyld-environment-variables' macos/entitlements.plist)" = "true"
          if /usr/libexec/PlistBuddy -c 'Print :com.apple.security.app-sandbox' macos/entitlements.plist; then exit 1; fi
          log_path="$PWD/macos-release-smoke.log"
          ./macos/IMMUNE.app/Contents/MacOS/IMMUNE --headless --audio-driver Dummy -- --release-smoke 2>&1 | tee "$log_path"
          grep -F "RELEASE_SMOKE_OK platform=macOS nodes=200" "$log_path"
          if grep -E "SCRIPT ERROR|Parse Error|Compile Error|ERROR:" "$log_path"; then exit 1; fi
          node ../tools/create_native_smoke_evidence.mjs \
            --platform=macOS \
            --log=macos-release-smoke.log \
            --artifact=IMMUNE-macOS.zip \
            --out=../native-smoke-evidence/macos.json \
            --commit="$GITHUB_SHA" \
            --version=0.5.0-rc.1

      - name: Upload hash-bound native smoke evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: immune-native-smoke-${{ runner.os }}-${{ github.sha }}
          path: native-smoke-evidence
          if-no-files-found: error
          retention-days: 30

  v8-6-native-smoke:
    needs: validate-and-export
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10

    steps:
      - name: Checkout evidence tooling
        uses: actions/checkout@v7

      - name: Set up Node.js for evidence sealing
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Download isolated V8.6 candidate artifacts
        uses: actions/download-artifact@v8
        with:
          name: immune-v8-6-candidate-${{ github.sha }}
          path: candidate

      - name: Launch Linux V8.6 candidate
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -o pipefail
          cd candidate
          chmod +x IMMUNE-linux.x86_64
          timeout 30s ./IMMUNE-linux.x86_64 --headless --audio-driver Dummy \
            --log-file linux-v8-6-smoke.log -- --release-smoke
          cat linux-v8-6-smoke.log
          grep -F "RELEASE_SMOKE_OK platform=Linux nodes=200" linux-v8-6-smoke.log
          if grep -E "SCRIPT ERROR|Parse Error|Compile Error|ERROR:" linux-v8-6-smoke.log; then exit 1; fi
          node ../tools/create_native_smoke_evidence.mjs \
            --platform=Linux \
            --log=linux-v8-6-smoke.log \
            --artifact=IMMUNE-linux.x86_64 \
            --pck=IMMUNE-linux.pck \
            --out=../v8-6-native-smoke-evidence/linux.json \
            --commit="$GITHUB_SHA" \
            --version=0.5.0-rc.1

      - name: Launch Windows V8.6 candidate
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $logPath = Join-Path $PWD "windows-v8-6-smoke.log"
          $arguments = @(
            "--headless",
            "--audio-driver", "Dummy",
            "--log-file", $logPath,
            "--", "--release-smoke"
          )
          $process = Start-Process -FilePath ".\candidate\IMMUNE-windows.exe" -ArgumentList $arguments -PassThru
          if (-not $process.WaitForExit(30000)) {
            $process.Kill($true)
            throw "Windows V8.6 smoke timed out after 30 seconds"
          }
          if ($process.ExitCode -ne 0) {
            throw "Windows V8.6 candidate exited with code $($process.ExitCode)"
          }
          $log = Get-Content $logPath -Raw
          Write-Output $log
          if ($log -notmatch "RELEASE_SMOKE_OK platform=Windows nodes=200") {
            throw "Windows V8.6 release smoke marker missing"
          }
          if ($log -match "SCRIPT ERROR|Parse Error|Compile Error|ERROR:") {
            throw "Windows V8.6 release log contains an engine error"
          }
          $versionInfo = (Get-Item ".\candidate\IMMUNE-windows.exe").VersionInfo
          if ($versionInfo.ProductName -ne "IMMUNE") {
            throw "Windows ProductName mismatch: $($versionInfo.ProductName)"
          }
          if ($versionInfo.CompanyName -ne "wchklaus97") {
            throw "Windows CompanyName mismatch: $($versionInfo.CompanyName)"
          }
          if ($versionInfo.FileDescription -ne "IMMUNE V8.6 visual candidate") {
            throw "Windows FileDescription mismatch: $($versionInfo.FileDescription)"
          }
          node tools/create_native_smoke_evidence.mjs `
            --platform=Windows `
            --log="$logPath" `
            --artifact=candidate/IMMUNE-windows.exe `
            --pck=candidate/IMMUNE-windows.pck `
            --out=v8-6-native-smoke-evidence/windows.json `
            --commit="$env:GITHUB_SHA" `
            --version=0.5.0-rc.1

      - name: Launch macOS V8.6 candidate
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -o pipefail
          cd candidate
          unzip -q IMMUNE-macOS.zip -d macos
          chmod +x macos/IMMUNE.app/Contents/MacOS/IMMUNE
          codesign --verify --deep --strict macos/IMMUNE.app
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' macos/IMMUNE.app/Contents/Info.plist)" = "com.wchklaus97.immune.v86candidate"
          architectures="$(lipo -archs macos/IMMUNE.app/Contents/MacOS/IMMUNE)"
          [[ "$architectures" == *arm64* && "$architectures" == *x86_64* ]]
          log_path="$PWD/macos-v8-6-smoke.log"
          ./macos/IMMUNE.app/Contents/MacOS/IMMUNE --headless --audio-driver Dummy \
            -- --release-smoke 2>&1 | tee "$log_path"
          grep -F "RELEASE_SMOKE_OK platform=macOS nodes=200" "$log_path"
          if grep -E "SCRIPT ERROR|Parse Error|Compile Error|ERROR:" "$log_path"; then exit 1; fi
          node ../tools/create_native_smoke_evidence.mjs \
            --platform=macOS \
            --log=macos-v8-6-smoke.log \
            --artifact=IMMUNE-macOS.zip \
            --out=../v8-6-native-smoke-evidence/macos.json \
            --commit="$GITHUB_SHA" \
            --version=0.5.0-rc.1

      - name: Upload hash-bound V8.6 native smoke evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: immune-v8-6-native-smoke-${{ runner.os }}-${{ github.sha }}
          path: v8-6-native-smoke-evidence
          if-no-files-found: error
          retention-days: 30
